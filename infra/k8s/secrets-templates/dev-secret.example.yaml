# SHAPE ONLY — this file documents which keys `recall-secrets` must hold.
#
# DO NOT put real values here and DO NOT `kubectl apply` this file. It is committed
# so the required keys are discoverable; the actual Secret is created out-of-band
# and never enters git.
#
# WHY THIS LIVES OUTSIDE infra/k8s/<env>/: ArgoCD syncs those directories with
# `directory.recurse`, so a template sitting in one would be applied on every sync
# and would overwrite the real recall-secrets with these "REPLACE_ME" placeholders.
# Keeping it out of the synced tree makes that impossible rather than merely
# excluded by a glob that a rename could defeat.
#
# Create it with (dev shown; use -n prod for the other namespace):
#
#   kubectl create secret generic recall-secrets -n dev \
#     --from-literal=DEEPGRAM_API_KEY='...'
#
# In practice bootstrap.sh does this for both namespaces from an env file.
#
# Where the value comes from:
#
#   DEEPGRAM_API_KEY
#     Speech-to-text for voice answers. Locally it lives in
#     services/tutor-agent/.env, which is gitignored. Only the tutor-agent reads
#     it; without it, voice input fails and typed answers still work.
#
# ── THERE ARE NO AWS CREDENTIALS HERE, AND THAT IS DELIBERATE ──────────────
#
# Pods get AWS access by inheriting the WORKER NODE's IAM role through the instance
# metadata service. boto3's default credential chain finds it with no configuration —
# nothing in services/ reads AWS_ACCESS_KEY_ID — and AWS rotates those credentials
# automatically. The policy is defined in infra/terraform/iam.tf and attached to the
# node role in infra/terraform/modules/k8s-cluster/main.tf.
#
# This replaced an earlier design that put static keys for a dedicated `-app` IAM user
# in this Secret. That scoped access per-workload rather than per-node, which is
# better, but `terraform destroy` deletes the user — so the keys died on every
# teardown, and this project destroys and re-applies daily (the course budget keeper
# stops EC2 twice a day, and a stopped kubeadm control plane cannot be restarted).
# Credentials that must be re-minted and re-pasted every cycle get pasted wrong.
#
# What it gives up: every pod on a worker node gets those permissions, not only
# Recall's four. Pod-level scoping is IRSA's job, and IRSA needs an OIDC provider that
# a kubeadm cluster does not have.
#
# DO NOT ADD AWS_ACCESS_KEY_ID BACK unless you mean it. boto3 PREFERS an explicit
# environment variable over the instance role, so a stale key here silently SHADOWS a
# perfectly good node role and the pods fail with InvalidClientTokenId. bootstrap.sh
# prints a warning if it finds one.
apiVersion: v1
kind: Secret
metadata:
  name: recall-secrets
  namespace: dev
  labels:
    app.kubernetes.io/part-of: recall
type: Opaque
stringData:
  DEEPGRAM_API_KEY: "REPLACE_ME"
