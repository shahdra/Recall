# SHAPE ONLY — this file documents which keys `recall-secrets` must hold.
#
# DO NOT put real values here and DO NOT `kubectl apply` this file. It is committed
# so the required keys are discoverable; the actual Secret is created out-of-band
# and never enters git.
#
# WHY THIS LIVES OUTSIDE infra/k8s/<env>/: ArgoCD syncs those directories with
# `directory.recurse`, so a template sitting in one would be applied on every sync
# and would overwrite the real recall-secrets with these "REPLACE_ME" placeholders.
# Keeping it out of the synced tree makes that impossible rather than merely
# excluded by a glob that a rename could defeat.
#
# Create it with (prod shown; use -n dev for the other namespace):
#
#   kubectl create secret generic recall-secrets -n prod \
#     --from-literal=AWS_ACCESS_KEY_ID='AKIA...' \
#     --from-literal=AWS_SECRET_ACCESS_KEY='...' \
#     --from-literal=DEEPGRAM_API_KEY='...'
#
# Where the values come from:
#
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
#     The `shahdra-recall-us-east-1-app` IAM user created by Terraform. Mint the
#     pair with `aws iam create-access-key --user-name shahdra-recall-us-east-1-app`
#     (see infra/terraform/RUNBOOK.md §4). Terraform deliberately does not manage
#     the keys, because aws_iam_access_key writes the secret into Terraform state
#     in plaintext and that state lives in a shared account.
#
#     Static keys rather than a role because this is kubeadm on EC2 with no OIDC
#     provider — there is no IRSA, and the worker node's instance role grants only
#     SSM and ECR. See infra/terraform/iam.tf.
#
#   DEEPGRAM_API_KEY
#     Speech-to-text for voice answers. Locally it lives in
#     services/tutor-agent/.env, which is gitignored. Only the tutor-agent reads
#     it; without it, voice input fails and typed answers still work.
#
# To rotate the AWS keys with no downtime: create the second key pair, update the
# Secret, `kubectl rollout restart` the deployments, confirm healthy, then delete
# the old key. IAM permits two keys per user for exactly this.
apiVersion: v1
kind: Secret
metadata:
  name: recall-secrets
  namespace: prod
  labels:
    app.kubernetes.io/part-of: recall
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  DEEPGRAM_API_KEY: "REPLACE_ME"
