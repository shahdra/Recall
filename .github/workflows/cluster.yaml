# Provision the Kubernetes cluster and bootstrap it. Manual trigger only.
#
# Two sequential jobs:
#   1. provision  - terraform apply for the selected region
#   2. bootstrap  - SSH into the control plane and idempotently install Calico, the
#                   EBS CSI driver, the dev/prod/argocd namespaces, recall-secrets,
#                   ArgoCD, and the two ArgoCD Applications
#
# WHY THIS EXISTS RATHER THAN THE MANUAL RUNBOOK STEPS:
# infra/terraform/RUNBOOK.md tells you to SSH in and `tail -f /var/log/user-data.log`
# until you see "control-plane bootstrap COMPLETE" — a human watching a log as the
# synchronisation primitive. That is unreliable in a specific way: sshd accepts
# connections long before `kubeadm init` finishes, so anything that keys off "can I
# SSH yet" races ahead and fails. Control-plane user-data touches
# /var/lib/cloud/control-plane-ready as its very last action, and this workflow polls
# for THAT FILE. The runbook stays valid for hand-driving; this is the reliable path.
#
# It also fixes two smaller things the manual flow gets wrong: it applies a SAVED
# plan, so what runs is exactly what was reviewed, and it shreds the staged
# credentials off both the runner and the node even when bootstrap fails. Following
# the runbook by hand leaves a live AWS secret key in /tmp on the control plane.
#
# The bootstrap job is safe to re-run: infra/k8s/bootstrap.sh is idempotent, so
# dispatching this against an already-bootstrapped cluster is a no-op, not an error.
#
# WORKSPACE == REGION. ONE cluster serves both dev and prod, separated by Kubernetes
# namespace, so the Terraform workspace identifies the REGION, not the environment.
# main.tf has a precondition that fails the plan if the two disagree.
#
# NO DESTROY JOB, deliberately. Teardown stays manual (RUNBOOK.md §7) because it is
# irreversible — it deletes the three DynamoDB tables and every card and review
# history in them, with point_in_time_recovery off and no backup. A one-click destroy
# button next to a one-click provision button is a mis-click away from that.
#
# ── COST WARNING ────────────────────────────────────────────────────────────
# This workflow SPENDS MONEY: ~$0.07/hour for two t3.medium instances plus EBS.
# Two things follow, both specific to this course account:
#
#   * A Lambda (aws-learning-budget-keeper-function) stops every EC2 instance at
#     16:00 and 00:00 local (13:00/21:00 UTC — verified against the EventBridge rule
#     `learning-budget-keeper-schedule`, cron(0 13,21 * * ? *)).
#   * A stopped kubeadm control plane is NOT restartable. `kubeadm init` baked its
#     public IP into the API server certificate SANs, so it comes back with an IP that
#     fails TLS on every kubectl call and every worker join.
#
# So the recovery path for a stopped cluster is re-running this workflow (~15 min),
# never starting the instance. And a cluster left running is billed until the next
# sweep, then becomes junk that still bills for its EBS volumes. Destroy when done.
name: Provision Cluster

on:
  workflow_dispatch:
    inputs:
      region:
        description: "AWS region (needs a matching infra/terraform/tfvars/<region>.tfvars.example)"
        type: choice
        default: us-east-1
        options:
          # Only us-east-1 is offered because it is the only region with a committed
          # tfvars example. Adding a region means adding
          # infra/terraform/tfvars/<region>.tfvars.example and one line here — no
          # code changes. Offering a region with no tfvars would fail at plan time
          # with a confusing "no such file" error.
          - us-east-1
      worker_desired_capacity:
        description: "Desired worker nodes (0 provisions the control plane only)"
        type: string
        default: "1"
      run_bootstrap:
        description: "Run the bootstrap job after provisioning (Calico, ArgoCD, secrets)"
        type: boolean
        default: true

# Never let two provisions of the same region run at once — they would fight over the
# same Terraform state lock.
concurrency:
  group: cluster-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    outputs:
      control_plane_ip: ${{ steps.tf_out.outputs.control_plane_ip }}
      cluster_name: ${{ steps.tf_out.outputs.cluster_name }}
      worker_asg_name: ${{ steps.tf_out.outputs.worker_asg_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}

      - uses: hashicorp/setup-terraform@v3
        with:
          # So `terraform output -raw` returns a bare value instead of being wrapped
          # in the wrapper script's log noise, which would corrupt $GITHUB_OUTPUT.
          terraform_wrapper: false

      # .gitignore:34 ignores *.tfvars with only an !*.tfvars.example exception, so a
      # CI checkout has the example but NOT the real file. Copying is required, not
      # convenience — without it the plan fails with "no such file".
      #
      # This is safe because the example holds no secrets: every value in it is a
      # region, an instance type, or a CIDR. The one sensitive-adjacent value,
      # ssh_key_name, names a key pair rather than containing a key.
      - name: Materialise the tfvars file
        working-directory: infra/terraform
        run: |
          SRC="tfvars/${{ inputs.region }}.tfvars.example"
          test -f "$SRC" || { echo "::error::$SRC not found — add it before selecting this region"; exit 1; }
          cp "$SRC" "tfvars/${{ inputs.region }}.tfvars"
          echo "copied $SRC -> tfvars/${{ inputs.region }}.tfvars"

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init

      - name: Select the workspace for this region
        working-directory: infra/terraform
        # -or-create makes a first-ever deploy to a new region work with no manual
        # setup. The workspace name must EQUAL the region: main.tf's
        # workspace_region_guard precondition fails the plan otherwise.
        run: terraform workspace select -or-create "${{ inputs.region }}"

      - name: Terraform plan
        working-directory: infra/terraform
        run: |
          terraform plan \
            -var-file="tfvars/${{ inputs.region }}.tfvars" \
            -var "worker_desired_capacity=${{ inputs.worker_desired_capacity }}" \
            -out=tfplan

      # Surface the plan in the run log before applying. In a SHARED account this is
      # the record that matters afterwards: it is the evidence of what changed, and
      # any line that is not "will be created" on a first apply deserves a second
      # look. docs/plan.md:827 asks for instructor approval to apply — an archived
      # plan in the run log serves that better than a plan scrolled past in a
      # terminal.
      - name: Show the plan
        working-directory: infra/terraform
        run: |
          {
            echo "<details><summary>terraform plan</summary>"
            echo
            echo '```'
            terraform show -no-color tfplan
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        working-directory: infra/terraform
        # Apply the SAVED plan, so what runs is exactly what was planned and shown
        # above — not a re-plan that could have drifted in between.
        run: terraform apply -auto-approve tfplan

      - name: Collect outputs
        id: tf_out
        working-directory: infra/terraform
        run: |
          {
            echo "control_plane_ip=$(terraform output -raw control_plane_public_ip)"
            echo "cluster_name=$(terraform output -raw cluster_name)"
            echo "worker_asg_name=$(terraform output -raw worker_asg_name)"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        working-directory: infra/terraform
        run: |
          {
            echo "### Cluster provisioned"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Region | \`${{ inputs.region }}\` |"
            echo "| Cluster | \`$(terraform output -raw cluster_name)\` |"
            echo "| Control plane | \`$(terraform output -raw control_plane_public_ip)\` |"
            echo "| Worker ASG | \`$(terraform output -raw worker_asg_name)\` |"
            echo "| Workers | \`${{ inputs.worker_desired_capacity }}\` |"
            echo
            echo "⚠️ This cluster bills ~\$0.07/hour and will be STOPPED by the course"
            echo "budget keeper at 16:00 or 00:00 — a stopped control plane cannot be"
            echo "restarted. Destroy it when you are done: see \`infra/terraform/RUNBOOK.md\` §7."
          } >> "$GITHUB_STEP_SUMMARY"

  bootstrap:
    needs: provision
    if: inputs.run_bootstrap
    runs-on: ubuntu-latest
    env:
      CP_IP: ${{ needs.provision.outputs.control_plane_ip }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # The control plane is brand new, so its host key is unknown — and on a
          # re-provision the old key for a recycled IP would MISMATCH, which would
          # abort the connection outright. Trust-on-first-use is the pragmatic choice
          # for a disposable lab cluster whose lifetime is measured in hours.
          cat >> ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 20
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Wait for the control plane to finish initializing
        run: |
          # Poll for the sentinel that control-plane user-data touches as its very
          # last step (see control-plane-user-data.sh.tftpl). Waiting on the FILE
          # rather than on port 22 is the whole point: sshd accepts connections long
          # before `kubeadm init` has finished, so polling the port would let
          # bootstrap race ahead and fail against an API server that is not up.
          #
          # 60 x 15s = 15 minutes. A cold boot is ~8 (cri-o + kubeadm + image pulls),
          # so this is generous rather than tight.
          for attempt in $(seq 1 60); do
            if ssh -o BatchMode=yes "ubuntu@${CP_IP}" \
                 'test -f /var/lib/cloud/control-plane-ready' 2>/dev/null; then
              echo "control plane ready after $attempt attempt(s)"
              exit 0
            fi
            echo "not ready yet (attempt $attempt/60); sleeping 15s"
            sleep 15
          done
          echo "::error::control plane did not become ready within 15 minutes."
          echo "Check /var/log/user-data.log on the instance:"
          echo "  ssh ubuntu@${CP_IP} 'sudo tail -50 /var/log/user-data.log'"
          exit 1

      - name: Stage the recall-secrets env file on the control plane
        run: |
          # DEEPGRAM_API_KEY, which becomes the recall-secrets Secret in both dev and
          # prod. Deliberately not in git — see
          # infra/k8s/secrets-templates/dev-secret.example.yaml.
          #
          # This is the ONLY secret the app needs. AWS credentials are not here: pods
          # inherit the worker node's IAM role via the instance metadata service (see
          # infra/terraform/iam.tf), which is what makes this secret stable across
          # destroy/re-apply cycles — there is no key to re-mint.
          #
          # bootstrap.sh validates the key is present before doing any work, so a
          # malformed secret fails fast rather than eight minutes in.
          printf '%s\n' "${{ secrets.RECALL_ENV }}" > /tmp/recall.env
          test -s /tmp/recall.env || { echo "::error::RECALL_ENV secret is empty or unset"; exit 1; }
          scp /tmp/recall.env "ubuntu@${CP_IP}:/tmp/recall.env"
          shred -u /tmp/recall.env   # don't leave credentials on the runner

      - name: Bootstrap the cluster (idempotent)
        # REPO_REF is the branch bootstrap.sh clones ON THE NODE to read the two
        # ArgoCD Application manifests. Pinned to `dev` rather than github.ref_name so
        # that dispatching this workflow from a feature branch cannot apply that
        # branch's Application manifests to the cluster.
        #
        # This does NOT constrain which branch each environment deploys from:
        # recall-dev.yaml pins targetRevision: dev and recall-prod.yaml pins
        # targetRevision: main, so the Applications track the right branch regardless
        # of what was cloned here.
        run: |
          ssh -o BatchMode=yes "ubuntu@${CP_IP}" \
            "RECALL_ENV_FILE=/tmp/recall.env REPO_REF=dev bash -s" \
            < infra/k8s/bootstrap.sh

      - name: Remove the staged credentials from the node
        if: always() # run even if bootstrap failed — never leave secrets behind
        run: |
          ssh -o BatchMode=yes "ubuntu@${CP_IP}" \
            'shred -u /tmp/recall.env 2>/dev/null || true'

      - name: Cluster state
        if: always()
        run: |
          {
            echo "### Cluster bootstrapped"
            echo
            echo '```'
            ssh -o BatchMode=yes "ubuntu@${CP_IP}" 'kubectl get nodes -o wide' 2>&1 || true
            echo '```'
            echo
            echo '```'
            ssh -o BatchMode=yes "ubuntu@${CP_IP}" 'kubectl -n argocd get applications' 2>&1 || true
            echo '```'
            echo
            echo '```'
            ssh -o BatchMode=yes "ubuntu@${CP_IP}" 'kubectl -n dev get pods' 2>&1 || true
            echo '```'
            echo
            echo "**App URLs** — NodePorts answer on every node, so the control plane's"
            echo "IP works and is stabler than a worker's (the ASG replaces those):"
            echo
            echo "| Env | Frontend | Tutor agent |"
            echo "|---|---|---|"
            echo "| dev | http://${CP_IP}:30300 | http://${CP_IP}:30800 |"
            echo "| prod | http://${CP_IP}:31300 | http://${CP_IP}:31800 |"
            echo
            echo "Notes:"
            echo "- A worker takes ~6-8 min from launch to join. Pods stay \`Pending\` until it does."
            echo "- \`recall-prod\` is \`OutOfSync\` by design — it is manual-sync. Promote with \`argocd app sync recall-prod\`."
            echo "- Prod manifests are only bumped by a push to \`main\`, so prod may reference an"
            echo "  older tag than dev until you promote."
          } >> "$GITHUB_STEP_SUMMARY"
