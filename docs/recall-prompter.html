<title>Recall Prompter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Rubik:wght@500;600;700&display=swap">

<style>
/* dark-first: the bare :root IS the dark palette (used on a laptop in a dim room) */
:root{
  --ground:#0C1219;
  --panel:#131E29;
  --panel-2:#0F1822;
  --edge:rgba(246,242,233,.10);
  --edge-2:rgba(246,242,233,.055);
  --ink:#F6F2E9;
  --ink-2:#C3CFDC;
  --muted:#879BB2;
  --accent:#F5A524;
  --demo:#FF8A6B;
  --ok:#5FD3A0;
  --late:#F8776E;
  --say:2.05rem;
  --sans:'Heebo','Segoe UI',Arial,sans-serif;
  --ui:'Rubik','Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --ground:#F7F4EE; --panel:#FFFFFF; --panel-2:#F0EBE1;
    --edge:rgba(18,28,38,.14); --edge-2:rgba(18,28,38,.07);
    --ink:#141C24; --ink-2:#3B4B5B; --muted:#5E7186;
    --accent:#A96605; --demo:#C2452A; --ok:#137A52; --late:#B3261E;
  }
}
:root[data-theme="light"]{
  --ground:#F7F4EE; --panel:#FFFFFF; --panel-2:#F0EBE1;
  --edge:rgba(18,28,38,.14); --edge-2:rgba(18,28,38,.07);
  --ink:#141C24; --ink-2:#3B4B5B; --muted:#5E7186;
  --accent:#A96605; --demo:#C2452A; --ok:#137A52; --late:#B3261E;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); direction:rtl;
  min-height:100vh; display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* ── top rail ─────────────────────────────────────────── */
.rail{
  position:sticky; top:0; z-index:5;
  display:flex; align-items:center; gap:.9rem; flex-wrap:wrap;
  padding:.7rem clamp(.8rem,2.5vw,1.6rem);
  background:var(--panel-2); border-bottom:1px solid var(--edge);
}
.count{
  font-family:var(--ui); font-weight:700; font-size:.95rem;
  color:var(--muted); font-variant-numeric:tabular-nums; direction:ltr;
}
.count b{color:var(--ink);font-size:1.25rem}
.clock{
  font-family:var(--ui); font-weight:700; direction:ltr;
  font-variant-numeric:tabular-nums; font-size:2rem; line-height:1;
  letter-spacing:-.01em;
}
.target{
  font-family:var(--ui); font-size:.9rem; color:var(--muted);
  direction:ltr; font-variant-numeric:tabular-nums;
}
.pace{
  font-family:var(--ui); font-weight:700; font-size:.9rem;
  padding:.32rem .7rem; border-radius:999px;
  border:1px solid currentColor; white-space:nowrap;
}
.pace.ahead{color:var(--ok)} .pace.on{color:var(--accent)} .pace.late{color:var(--late)}
.pace.idle{color:var(--muted)}
.spacer{margin-inline-start:auto}
.btn{
  background:transparent; border:1px solid var(--edge);
  border-radius:8px; padding:.4rem .7rem; cursor:pointer;
  font-family:var(--ui); font-weight:600; font-size:.85rem; color:var(--ink-2);
}
.btn:hover{border-color:var(--accent);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#12181F}
:root[data-theme="light"] .btn.primary{color:#FFF8EC}

/* ── step ─────────────────────────────────────────────── */
main{flex:1;display:flex;flex-direction:column;min-height:0}
.stepwrap{
  flex:1; overflow-y:auto; padding:clamp(1rem,3vw,2.2rem) clamp(.9rem,4vw,3rem) 1rem;
}
.inner{max-width:60rem;margin:0 auto}
.head{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;margin-bottom:.35rem}
.title{
  font-family:var(--ui); font-weight:700; font-size:1.15rem;
  letter-spacing:.01em; color:var(--ink);
}
.dur{
  font-family:var(--ui);font-weight:600;font-size:.9rem;color:var(--muted);
  direction:ltr;font-variant-numeric:tabular-nums;
}
.tag{
  font-family:var(--ui);font-weight:700;font-size:.7rem;letter-spacing:.09em;
  text-transform:uppercase;padding:.2rem .55rem;border-radius:999px;
  background:color-mix(in srgb,var(--demo) 16%,transparent);color:var(--demo);
}
.tag.key{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}

.do{
  font-size:1rem; line-height:1.55; color:var(--muted);
  border-inline-start:3px solid var(--edge); padding-inline-start:.85rem;
  margin:.9rem 0 1.4rem;
}
.do strong{color:var(--ink-2);font-weight:700}

.say{display:flex;flex-direction:column;gap:1.05rem}
.say p{
  margin:0; font-size:var(--say); line-height:1.5; font-weight:400;
  text-wrap:pretty;
}
.say strong{font-weight:700;color:var(--ink)}
.say .cue{
  display:inline-block; font-style:normal; font-family:var(--ui);
  font-weight:600; font-size:.62em; color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);
  border-radius:6px; padding:.05em .45em; margin-inline-end:.35em;
  vertical-align:.12em;
}
code{
  font-family:var(--ui);font-weight:700;background:var(--panel);
  border:1px solid var(--edge);border-radius:5px;padding:0 .3em;font-size:.9em;
}
.sos{
  margin-top:1.4rem; padding:.75rem .95rem; border-radius:10px;
  background:color-mix(in srgb,var(--late) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--late) 38%,transparent);
  font-size:1.02rem; line-height:1.5; color:var(--ink-2);
}
.sos b{color:var(--late);font-family:var(--ui);font-size:.78rem;letter-spacing:.09em;
  text-transform:uppercase;display:block;margin-bottom:.2rem}

/* ── foot ─────────────────────────────────────────────── */
.foot{
  border-top:1px solid var(--edge); background:var(--panel-2);
  padding:.6rem clamp(.8rem,2.5vw,1.6rem) .75rem;
}
.bar{height:4px;background:var(--edge-2);border-radius:99px;overflow:hidden;margin-bottom:.6rem}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;
  transition:width .25s ease}
.footrow{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.trans{font-size:1rem;color:var(--ink-2);line-height:1.45}
.trans b{font-family:var(--ui);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent);margin-inline-end:.45rem}
.next{font-family:var(--ui);font-size:.85rem;color:var(--muted);margin-inline-start:auto;
  text-align:start}
.next b{color:var(--ink-2)}
.nav{display:flex;gap:.5rem}

.hint{font-family:var(--ui);font-size:.75rem;color:var(--muted);margin-top:.5rem;
  display:flex;gap:.9rem;flex-wrap:wrap}
.hint kbd{border:1px solid var(--edge);border-radius:4px;padding:0 .3em;
  font-family:var(--ui);font-weight:600}

@media (max-width:640px){
  :root{--say:1.6rem}
  .clock{font-size:1.6rem}
  .next{display:none}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="rail">
  <div class="count"><b id="cIdx">1</b> / <span id="cTot">21</span></div>
  <div class="clock" id="clock">0:00</div>
  <div class="target">יעד <span id="tgt">0:20</span></div>
  <div class="pace idle" id="pace">לחצי התחלה</div>
  <div class="spacer"></div>
  <div class="nav">
    <button class="btn primary" id="bStart">התחלה</button>
    <button class="btn" id="bReset">אפס</button>
    <button class="btn" id="bSmall" title="הקטן טקסט">A−</button>
    <button class="btn" id="bBig" title="הגדל טקסט">A+</button>
    <button class="btn" id="bTheme">בהיר</button>
    <button class="btn" id="bFull">מסך מלא</button>
  </div>
</div>

<main>
  <div class="stepwrap" id="scroll">
    <div class="inner">
      <div class="head">
        <span class="title" id="sTitle"></span>
        <span class="dur" id="sDur"></span>
        <span id="sTags"></span>
      </div>
      <div class="do" id="sDo"></div>
      <div class="say" id="sSay"></div>
      <div id="sSos"></div>
    </div>
  </div>

  <div class="foot">
    <div class="bar"><i id="bar" style="width:0%"></i></div>
    <div class="footrow">
      <div class="trans" id="sTrans"></div>
      <div class="next" id="sNext"></div>
      <div class="nav">
        <button class="btn" id="bPrev">הקודם</button>
        <button class="btn primary" id="bNext">הבא</button>
      </div>
    </div>
    <div class="hint">
      <span><kbd>רווח</kbd> הבא</span>
      <span><kbd>←</kbd> הבא</span>
      <span><kbd>→</kbd> הקודם</span>
      <span><kbd>S</kbd> טיימר</span>
      <span><kbd>T</kbd> ערכה</span>
      <span><kbd>F</kbd> מסך מלא</span>
    </div>
  </div>
</main>

<script>
const STEPS = [{"title":"1 · About Me — שקף 1","secs":20,"demo":false,"star":0,"do":"מול הקהל, לא להסתכל על המסך.","say":["שלום, אני שהד ריאן — בוגרת מדעי המחשב בחיפה, ובוגרת בוטקאמפ FURSA ב-AI וב-DevOps.","היום אציג את פרויקט הגמר שלי, **Recall**. ולא חיפשתי נושא לפרויקט — **הייתה לי בעיה אמיתית בקורס**, ורציתי משהו שיעזור לי כבר עכשיו."],"sos":[],"trans":"`↓`","cum":20},{"title":"2 · Recall — שקף 2","secs":20,"demo":false,"star":0,"do":"שקף Recall. **לא להקריא את המספרים למטה** (3 Services, 8 MCP tools…) — הם שם בשביל שיסתכלו, לא בשבילך.","say":["**Recall** זה AI study tutor שעונה לי על שתי שאלות: **מה** לחזור — ו**מתי**.","נותנים לו חומר, הוא הופך אותו ל-**cards**, בוחן אותי — בטקסט או בקול — **מדרג את התשובה ומסביר מה היה חסר**, וקובע מתי אראה את ה-card הזה שוב."],"sos":[],"trans":"`↓`","cum":40},{"title":"3+4 · Problem — שקפים 3 ו-4","secs":25,"demo":false,"star":0,"do":"שקף 3. במילה \"עקומת השכחה\" — `↓` לשקף 4, ולהצביע.","say":["בבוטקאמפ למדנו נושא חדש כל שבוע — **Python**, **AWS**, **Docker**, **Kubernetes**, **Terraform**.","בהתחלה זכרתי, ועם הזמן הידע התחיל להיעלם.","*(`↓`)* זו **עקומת השכחה** — בלי חזרה, הזיכרון יורד משמעותית כבר אחרי יום.","ואז הבנתי: **הבעיה לא הייתה ללמוד — אלא לזכור.**"],"sos":[],"trans":"`↓`","cum":65},{"title":"5 · Manual Way — שקף 5","secs":20,"demo":false,"star":0,"do":"לעצור רגע על **\"200 cards\"**.","say":["ואם עושים את זה ידנית עם flashcards — צריך לא רק ללמוד, אלא **לנהל את כל התהליך**: לכתוב שאלות, לבדוק תשובות, לתת לעצמנו ציון, ולהחליט מתי לחזור.","עם **200 cards** זה כבר הופך לעבודה בפני עצמה — במקום ללמוד."],"sos":[],"trans":"`↓`","cum":85},{"title":"6 · What If? — שקף 6","secs":10,"demo":false,"star":0,"do":"להסתכל על הקהל.","say":["אז שאלתי: **מה אם המערכת תעשה את כל זה בשבילי?**","**בואו נראה חי.**"],"sos":[],"trans":"**Alt+Tab לטאב 1.** שנייה של שקט. ⚠️ המצגת נשארת על **שקף 6**. בסוף הדמו — `↓` **פעמיים** → שקף 8.","cum":95},{"title":"DEMO 1 · הוק — נושא מהקהל","secs":20,"demo":true,"star":0,"do":"טאב 1 פתוח. **להסתובב אל הקהל ולחכות.** לא לדבר לתוך השקט.","say":["זו המערכת — רצה עכשיו על ה-**Kubernetes cluster** שלי, לא local.","ולפני שאני מסבירה עליה משהו — **תזרקו לי נושא שתרצו ללמוד.**"],"sos":["אין תשובה תוך שתי שניות: *\"אז ניקח **Kubernetes**\"* — ולהמשיך מיד."],"trans":"ללחוץ **Add material**.","cum":115},{"title":"DEMO 2 · Add material + הכרות","secs":20,"demo":true,"star":0,"do":"להקליד את הנושא, ללחוץ **Create**. **תוך כדי ההקלדה** — להצביע על שלושת ה-tabs.","say":["מעולה. אני נכנסת ל-**Add material**, כותבת את הנושא, ויוצרת.","*(להצביע)* והמערכת כולה בנויה משלושה חלקים: **Add material** — מביאים חומר. **Study** — לומדים. **Progress** — רואים איפה אני עומדת."],"sos":[],"trans":"ה-generation רץ.","cum":135},{"title":"DEMO 3 · generation","secs":30,"demo":true,"star":0,"do":"**לדבר לקהל, לא להסתכל על המסך.** הטקסט נכתב בדיוק לאורך ההמתנה.","say":["ובזמן שזה רץ — מה קורה מאחורה: ה-**Agent** קורא את החומר ו**כותב את השאלות בעצמו**. הוא מנסה לייצר שאלות שבודקות **אם הבנתי**, לא שינון.","*(כשמופיע)* וזהו — ה-**deck** מוכן. **השאלות האלה לא היו קיימות לפני דקה.**"],"sos":["תקוע מעל 40 שניות: *\"בואו לא נחכה\"* → deck מוכן מראש."],"trans":"**Study** → לפתוח את ה-deck החדש.","cum":165},{"title":"DEMO 4 · האדי עונה","secs":55,"demo":true,"star":0,"do":"לפתוח את ה-deck, להקריא את השאלה. **לתת להאדי לענות — ולא למלא את השקט.** לשלוח.","say":["אני נכנסת ל-**Study** ופותחת אותו — **כל ה-cards זמינים מיד**, הם חדשים.","**תראו את השאלה הזאת.** *(להקריא)* האדי — תענה לנו.","*(בזמן שהוא עונה)* ושימו לב שהוא צריך **לשלוף מהראש** — אין לו את התשובה מולו. זה **active recall**."],"sos":["נתקע: *\"תגיד מה שאתה זוכר, גם חלקי.\"*"],"trans":"לשלוח.","cum":220},{"title":"DEMO 5 · feedback + התאריך","secs":30,"demo":true,"star":0,"do":"להצביע לפי הסדר: **score** → התשובה המלאה → **מה היה חסר** → ואז למטה, **next review**.","say":["והוא לא אומר \"נכון\" או \"לא נכון\": *(להצביע)* הוא נותן **score**, מראה את **התשובה המלאה**, ומסביר **מה בדיוק היה חסר**.","וזה בדיוק החלק שלא הצלחתי לעשות לבד — **לדרג את עצמי בכנות.**","*(להצביע למטה)* ותראו — הוא כבר קבע **מתי נראה את ה-card הזה שוב**: התשובה הייתה חלקית, אז **מחר**."],"sos":[],"trans":"card הבא.","cum":250},{"title":"DEMO 6 · card שני — הניגוד","secs":25,"demo":true,"star":0,"do":"להדביק את **התשובה הטובה המוכנה**, לשלוח, ולהצביע על התאריך — **ולהשוות בקול לתאריך הקודם.**","say":["ועכשיו אחד נוסף — הפעם **תשובה מלאה**.","*(להצביע)* score גבוה, **ותראו את התאריך: הוא לא מחר.** הוא נדחף הרבה קדימה.","**אותה מערכת, שתי תשובות — שני תאריכים שונים לגמרי.**"],"sos":[],"trans":"ללחוץ **Progress**.","cum":275},{"title":"DEMO 7 · Progress","secs":20,"demo":true,"star":0,"do":"להצביע על ה-**accuracy** ועל **הנושאים החלשים**.","say":["ובמסך ה-**Progress** אני מקבלת את התשובה לשאלה שהתחלתי איתה — **מה אני צריכה ללמוד היום.**","*(להצביע)* ה-**accuracy** שלי, והנושאים שאני **הכי נכשלת בהם**.","כי **לכל card יש state משלו ב-DynamoDB**: כל תשובה, כל score, כל תאריך."],"sos":[],"trans":"Alt+Tab לטאב 2.","cum":295},{"title":"DEMO 8 · Grafana","secs":15,"demo":true,"star":0,"do":"להצביע על **traffic**, ועל **errors / health**.","say":["ורציתי מערכת אמיתית, לא רק demo. זה **Grafana** — *(להצביע)* כל ה-**requests** שעשינו עכשיו נמצאים כאן, live. וכאן **error rate** וה-**health של ה-services**."],"sos":[],"trans":"**Alt+Tab למצגת** + להגיד: **\"ראינו את המערכת מבחוץ. עכשיו מה שקורה מאחורי הקלעים.\"** ואז **`↓` פעמיים** → שקף 8.","cum":310},{"title":"8 · Email — שקף 8","secs":10,"demo":false,"star":0,"do":"שקף 8.","say":["וכל יום אני מקבלת **email** שמזכיר לי כמה כרטיסים יש לי היום — כדי שלא אשכח לחזור."],"sos":[],"trans":"`↓`","cum":320},{"title":"9 · SM-2 — שקף 9","secs":15,"demo":false,"star":0,"do":"להצביע על הרצף העולה.","say":["והאלגוריתם שקובע את התאריכים הוא **SM-2**: טעיתי — **מחר**. צדקתי — **1, 6, 15, 39, 97 ימים**.","זה **Active Recall** ו-**Spaced Repetition**."],"sos":[],"trans":"`↓`","cum":335},{"title":"10 · Architecture — שקף 10","secs":80,"demo":false,"star":1,"do":"**לא לקרוא את הדיאגרמה.** לעקוב עם היד: דפדפן → S3 → Tutor Agent → Sub-Agent → חזרה. **לעצור על החץ בין ה-Agents.**","say":["אתם רואים את השכבות, אז במקום לעבור תיבה־תיבה — **אקח סטודנט אחד ואראה מה קורה לו.**","הוא נכנס לדפדפן, בוחר נושא, ומעלה **PDF**.","ה-PDF מגיע ל-**Frontend**, ו**המסמך הגולמי נשמר ב-S3** — שם יושבים כל החומרים המקוריים.","משם התוכן נשלח ל-**Tutor Agent**: הוא ממיר אותו ל**טקסט**, ומעבד עם **NLP** כדי **להבין** מה כתוב — ומתוך זה מייצר חומר לימוד ושאלות.","**וכאן הנקודה המעניינת:** ה-Tutor Agent **לא עושה הכל בעצמו**. כשמשימה דורשת התמחות הוא **שולח אותה ל-Sub-Agent המתאים**, וה-Sub-Agent **מחזיר לו את התוצאה**.","כלומר יש כאן **communication between agents** — כל Agent עושה את מה שהוא מתמחה בו. וכשצריך לגעת במידע, זה עובר דרך **MCP**: **הסוכן מחליט, ה-tool מבצע.**","ובסוף ה-**Tutor Agent מחזיר לסטודנט** את החומר ואת ה-**cards**.","וזה כל המסלול: **מהדפדפן, דרך S3, ל-Tutor Agent, ל-Sub-Agents — וחזרה לסטודנט.**"],"sos":[],"trans":"**`↓` פעמיים** (מדלגת על שקף 11) → שקף 12.","cum":415},{"title":"12 · Observability — שקף 12","secs":40,"demo":false,"star":0,"do":"לעקוב על המסלול **Normal → Pending → Firing → Email**.","say":["**Observability** זה לדעת מה קורה למערכת **בלי לבהות במסך**.","**Prometheus** אוסף מדדים מה-agent, **Alertmanager** מחליט מתי להתריע, ו-**SNS** שולח מייל.","*(לעקוב)* ה-agent מפסיק לענות → **Pending**. וכאן הלב: **`for: 2m`** — מתריעים **רק אם הבעיה נמשכת שתי דקות**, כדי לא לקבל מייל על כל blip.","נמשך → **Firing** → מייל `[FIRING]`. חזר → `[RESOLVED]`, וה-alert נסגר לבד.","**המערכת מנטרת את עצמה — ורק כשמשהו באמת נשבר, מייל מחכה לי.**"],"sos":[],"trans":"`↓`","cum":455},{"title":"13 · Delivery — שקף 13","secs":15,"demo":false,"star":0,"do":"מהר.","say":["והכל רץ כ-**Docker containers** על **Kubernetes** על **EC2**. את ה-**cluster** הקמתי בעצמי, את התשתית ב-**Terraform**, וה-**deployment** אוטומטי — כל push בונה **image** ו-**Argo CD** מסנכרן."],"sos":[],"trans":"`↓`","cum":470},{"title":"14 · Testing — שקף 14","secs":40,"demo":false,"star":0,"do":"להצביע על שתי הקבוצות — **Unit** ואז **Integration** — ובסוף על ה-**green check** של ה-PR.","say":["הכלל בבדיקות: **מה שלא בשליטתי — mock. מה שכן שלי — בודקים באמת.**","את **AWS** אני עושה mock — אין טעם שאני אבדוק את אמזון. אבל את **SM-2** — הלוגיקה שקובעת מתי card חוזר — אני בודקת על **כל מסלול ציון**, כי אם היא טועה, **כל הלמידה טועה.**","בערך **235 unit tests**, ומעליהם **integration** אמיתי: **MCP server** אמיתי מול **DynamoDB Local**, מסלול שלם — card נוצר, נשלף בזמן, ומתעדכן אחרי ציון.","וכל **PR** חייב להיות ירוק."],"sos":[],"trans":"`↓`","cum":510},{"title":"15 · Working with AI — שקף 15","secs":15,"demo":false,"star":0,"do":"שקף 15. משפט אחרון — **להאט.**","say":["ה-**AI** כתב הרבה מהקוד — **אבל לא קיבל אף החלטה.**","עבדתי **spec לפני קוד**, ואז **test first**: **הבדיקה** מגדירה מה נכון, לא המודל.","ה-**intervals** של SM-2, וה-**fail-safe** כשהציון לא תקין — **אלה היו שלי.**"],"sos":[],"trans":"`↓`","cum":525},{"title":"16 · Close — שקף 16","secs":15,"demo":false,"star":0,"do":"**להאט.**","say":["אז זה **Recall**. התחלתי מבעיה אישית — לומדת ושוכחת — ובניתי מערכת שעושה את זה בשבילי.","ובניתי אותה כמערכת אמיתית, עם **deployment** ו-**monitoring** — **שגם אחרים יוכלו להשתמש בה.**","תודה, אשמח לשאלות."],"sos":[],"trans":"אין. להישאר על שקף 16.","cum":540}];

const $ = id => document.getElementById(id);
let i = 0, t0 = null, elapsed = 0, running = false;

const mmss = s => {
  s = Math.max(0, Math.round(s));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};

/* inline markup: **bold**, *(stage cue)*, `key` */
function fmt(str){
  const esc = str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc
    .replace(/\*\((.+?)\)\*/g, '<em class="cue">$1</em>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.+?)`/g, '<code>$1</code>');
}

function startOf(n){ return n === 0 ? 0 : STEPS[n-1].cum; }

function render(){
  const s = STEPS[i];
  $('cIdx').textContent = i + 1;
  $('sTitle').textContent = s.title;
  $('sDur').textContent = mmss(s.secs);
  $('tgt').textContent = mmss(s.cum);

  let tags = '';
  if (s.demo) tags += '<span class="tag">Demo</span> ';
  if (s.star) tags += '<span class="tag key">' + (s.star > 1 ? 'קריטי' : 'חשוב') + '</span>';
  $('sTags').innerHTML = tags;

  $('sDo').innerHTML = s.do ? fmt(s.do) : '';
  $('sDo').style.display = s.do ? '' : 'none';

  $('sSay').innerHTML = s.say.map(p => '<p>' + fmt(p) + '</p>').join('');

  $('sSos').innerHTML = s.sos.length
    ? s.sos.map(x => '<div class="sos"><b>אם נתקע</b>' + fmt(x) + '</div>').join('')
    : '';

  $('sTrans').innerHTML = s.trans ? '<b>מעבר</b>' + fmt(s.trans) : '';
  const nx = STEPS[i+1];
  $('sNext').innerHTML = nx ? 'הבא: <b>' + nx.title + '</b>' : 'סוף';

  $('bar').style.width = (100 * s.cum / STEPS[STEPS.length-1].cum) + '%';
  $('scroll').scrollTop = 0;
  tick();
}

function go(n){
  i = Math.min(STEPS.length - 1, Math.max(0, n));
  render();
}

function tick(){
  if (running && t0 !== null) elapsed = (Date.now() - t0) / 1000;
  $('clock').textContent = mmss(elapsed);

  const p = $('pace');
  if (!running && elapsed === 0){
    p.className = 'pace idle';
    p.textContent = 'לחצי התחלה';
    return;
  }
  const diff = elapsed - startOf(i);      // + means behind schedule
  if (diff < -8){
    p.className = 'pace ahead';
    p.textContent = 'מקדימה ' + mmss(-diff);
  } else if (diff <= 15){
    p.className = 'pace on';
    p.textContent = 'בזמן';
  } else {
    p.className = 'pace late';
    p.textContent = 'מאחרת ' + mmss(diff);
  }
}

function toggleTimer(){
  if (running){
    elapsed = (Date.now() - t0) / 1000;
    running = false;
    $('bStart').textContent = 'המשך';
  } else {
    t0 = Date.now() - elapsed * 1000;
    running = true;
    $('bStart').textContent = 'עצור';
  }
  tick();
}

function resetAll(){
  running = false; elapsed = 0; t0 = null;
  $('bStart').textContent = 'התחלה';
  go(0);
}

$('bNext').onclick = () => go(i + 1);
$('bPrev').onclick = () => go(i - 1);
$('bStart').onclick = toggleTimer;
$('bReset').onclick = resetAll;

function store(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

function isLight(){
  const stamp = document.documentElement.getAttribute('data-theme');
  if (stamp) return stamp === 'light';
  return matchMedia('(prefers-color-scheme: light)').matches;
}
function syncThemeLabel(){ $('bTheme').textContent = isLight() ? 'כהה' : 'בהיר'; }

$('bTheme').onclick = () => {
  const next = isLight() ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  store('recall.theme', next);
  syncThemeLabel();
};

let saySize = parseFloat(load('recall.say')) || 2.05;
function applySize(){
  document.documentElement.style.setProperty('--say', saySize.toFixed(2) + 'rem');
  store('recall.say', saySize);
}
$('bBig').onclick = () => { saySize = Math.min(3.4, saySize + 0.15); applySize(); };
$('bSmall').onclick = () => { saySize = Math.max(1.2, saySize - 0.15); applySize(); };

$('bFull').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
};

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch (e.key){
    case ' ': case 'Enter': case 'PageDown': case 'ArrowLeft':
      e.preventDefault(); go(i + 1); break;
    case 'ArrowRight': case 'PageUp':
      e.preventDefault(); go(i - 1); break;
    case 'ArrowDown': e.preventDefault(); $('scroll').scrollTop += 90; break;
    case 'ArrowUp': e.preventDefault(); $('scroll').scrollTop -= 90; break;
    case 'Home': e.preventDefault(); go(0); break;
    case 'End': e.preventDefault(); go(STEPS.length - 1); break;
    case 's': case 'S': e.preventDefault(); toggleTimer(); break;
    case 'r': case 'R': e.preventDefault(); resetAll(); break;
    case 't': case 'T': e.preventDefault(); $('bTheme').click(); break;
    case '+': case '=': e.preventDefault(); $('bBig').click(); break;
    case '-': case '_': e.preventDefault(); $('bSmall').click(); break;
    case 'f': case 'F': e.preventDefault(); $('bFull').click(); break;
  }
});

const savedTheme = load('recall.theme');
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
syncThemeLabel();
applySize();

$('cTot').textContent = STEPS.length;
setInterval(tick, 250);
render();
</script>
